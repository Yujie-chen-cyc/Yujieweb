<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Pollination Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Background will be set in CSS -->
        
        <!-- Game Entities -->
        <img src="../bee.png" alt="Bee" id="bee" class="entity">
        <img src="../dragonfly.png" alt="Dragonfly" id="dragonfly" class="entity">
        <img src="../flower1.png" alt="Pink Flower" id="pink-flower" class="entity">
        <img src="../ok.png" alt="OK" id="ok-pink" class="ok-mark">
        <img src="../scallion.png" alt="Garlic" id="garlic" class="entity">
        <img src="../Flower-4.png" alt="Red Flower" id="red-flower" class="entity">
        <img src="../ok.png" alt="OK" id="ok-red" class="ok-mark">
        <img src="../berry.png" alt="Berry" id="berry" class="entity">

        <!-- Controls (Arrows) -->
        <div id="controls">
            <img src="../arrow.png" alt="Up Arrow" id="arrow-up" class="control-arrow">
            <img src="../arrow.png" alt="Down Arrow" id="arrow-down" class="control-arrow">
            <img src="../arrow.png" alt="Left Arrow" id="arrow-left" class="control-arrow">
            <img src="../arrow.png" alt="Right Arrow" id="arrow-right" class="control-arrow">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
